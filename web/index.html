<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ShopEase - A modern e-commerce app built with Flutter.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="shopease">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <title>ShopEase 🛍️</title>

  <!-- Preload fonts -->
  <link rel="preload" href="assets/fonts/Poppins-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/Poppins-Bold.ttf" as="font" type="font/ttf" crossorigin>

  <!-- Preload logo -->
  <link rel="preload" href="assets/images/logo.png" as="image">
</head>
<body>
  <!-- Loading Placeholder -->
  <div id="loading" style="display:flex;justify-content:center;align-items:center;height:100vh;">
    <div>
      <img src="assets/images/logo.png" alt="ShopEase Logo" width="120">
      <p style="font-family:'Poppins',sans-serif;font-size:1.2rem;color:#555;text-align:center;margin-top:1rem;">
        Loading ShopEase...
      </p>
    </div>
  </div>

  <!-- Flutter bootstrap script -->
  <script src="main.dart.js" type="application/javascript"></script>

  <noscript>
    <p style="text-align:center;color:red;">
      This app requires JavaScript to run. Please enable JavaScript in your browser.
    </p>
  </noscript>
</body>
</html>
