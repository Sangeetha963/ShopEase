<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ShopEase - A modern e-commerce app built with Flutter.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="shopease">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Base href for routing -->
  <base href="$FLUTTER_BASE_HREF">

  <title>ShopEase 🛍️</title>

  <!-- Optional: Preload fonts for faster rendering -->
  <link rel="preload" href="assets/fonts/Poppins-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/Poppins-Bold.ttf" as="font" type="font/ttf" crossorigin>

  <!-- Optional: Preload key images for above-the-fold content -->
  <link rel="preload" href="assets/images/logo.png" as="image">
</head>
<body>
  <!-- Loading Placeholder -->
  <div id="loading" style="display:flex;justify-content:center;align-items:center;height:100vh;">
    <div>
      <img src="assets/images/logo.png" alt="ShopEase Logo" width="120">
      <p style="font-family:Poppins,sans-serif;font-size:1.2rem;color:#555;text-align:center;margin-top:1rem;">
        Loading ShopEase...
      </p>
    </div>
  </div>

  <!-- Flutter bootstrap script -->
  <script src="flutter_bootstrap.js" async defer></script>

  <!-- Optional: Lazy-load third-party JS (analytics, chat) after Flutter is ready -->
  <script>
    window.addEventListener('load', () => {
      // Example: lazy-load Google Analytics after Flutter app loads
      // const gaScript = document.createElement('script');
      // gaScript.src = "https://www.googletagmanager.com/gtag/js?id=GA_MEASUREMENT_ID";
      // gaScript.async = true;
      // document.body.appendChild(gaScript);
    });
  </script>

  <noscript>
    <p style="text-align:center;color:red;">
      This app requires JavaScript to run. Please enable JavaScript in your browser.
    </p>
  </noscript>
</body>
</html>
